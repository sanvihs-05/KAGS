[pytest]
# Collect only the real suite.
#
# scripts/test_*.py are manual demo / verification scripts, not pytest tests:
# they rewire sys.path to import `backend` as a top-level package
# (`from core.graph_of_thoughts import ...`), which collides with the
# package-relative imports the rest of the codebase uses. pytest picked them up
# purely because of the `test_` filename prefix and died during collection, so
# a bare `pytest` at the repo root failed even when every real test passed.
testpaths = tests

norecursedirs = venv .venv .git __pycache__ outputs visual_outputs results
                node_modules embeddings_generator cubicasa_rag_store

filterwarnings =
    ignore::DeprecationWarning
